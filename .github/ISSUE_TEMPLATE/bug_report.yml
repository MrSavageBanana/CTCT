name: Bug Report
description: File a bug report to improve CTCT
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please search existing issues first to avoid duplicates.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe what happens...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to Reproduce
      description: Describe how to reproduce the issue step by step.
      placeholder: |
        1. Run '...'
        2. Input '....'
        4. See error
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment Details
      description: Operating system, Bash Version, dependency versions
      placeholder: |
        - OS: [e.g. Arch Linux, Ubuntu, macOS, Windows]
        - Bash Version [e.g. version 5.3.15 ]
        - Version of each dependency
    validations:
      required: false

  - type: textarea
    id: screenshotsLogs
    attributes:
      label: Screenshots, Screen recordings and Logs
      description: Drag and drop screenshots, recordings or paste terminal output
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct & Guidelines
      options:
        - label: I have verified that this issue hasn't been reported before.
          required: true
